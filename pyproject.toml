[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lotoconfere"
dynamic = ["version"]
description = "Confira apostas das loterias da Caixa, em um concurso ou em uma teimosinha."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mtiengo" }]
keywords = ["loteria", "caixa", "megasena", "lotofacil", "quina", "teimosinha"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]
# The GUI is the product, so its toolkit is a runtime dependency, not an extra.
# PySide6-Essentials, never the PySide6 meta-package: the meta-package also pulls
# PySide6-Addons, whose Qt modules are licensed GPL/commercial only. A module that
# is not installed cannot be imported or bundled by accident.
dependencies = [
    "PySide6-Essentials>=6.8",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Freezing the app for three operating systems. Kept out of `dev` because it is
# never needed to run the tests, and CI's test jobs should not install a build
# toolchain they do not use.
build = [
    "pyinstaller>=6.11",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

# gui-scripts, not scripts: on Windows this entry point gets no console window.
[project.gui-scripts]
lotoconfere = "lotoconfere.__main__:main"

[tool.hatch.version]
path = "src/lotoconfere/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lotoconfere"]

# --- Tooling (tests, lint, types, coverage) ----------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Unit tests never touch the network: the live marker is excluded by default, so
# reaching the real endpoint takes an explicit `pytest -m live` (local, manual).
addopts = "-ra --strict-markers --strict-config -m 'not live'"
markers = [
    "live: hits the real Caixa or mirror endpoint; run by hand, never in CI",
]
qt_api = "pyside6"
# A leaked file or connection fails the run instead of scrolling past as a warning.
# Most leaks are reported from __del__ during garbage collection, where pytest can
# only catch the error as "unraisable", so that warning has to be an error too.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["lotoconfere"]
branch = true

[tool.coverage.report]
show_missing = true
# The gated scope and the threshold are the quality-gate skill's to explain.
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch_*", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "C4",            # flake8-comprehensions
    "RET",           # flake8-return
    "ARG",           # flake8-unused-arguments
    "PTH",           # flake8-use-pathlib
    "TID",           # flake8-tidy-imports
    "ANN",           # flake8-annotations (enforce the py.typed contract)
    "S",             # flake8-bandit (untrusted input is the whole threat model)
    "RUF",           # ruff-specific
    "PL",            # pylint (C/E/R/W)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# These bindings are GPL and look nearly identical to PySide6 in code, so a stray
# import compiles and passes tests while obliging the whole app to ship as GPL.
"PyQt5".msg = "GPL binding: use PySide6 (LGPL). The project ships under MIT."
"PyQt6".msg = "GPL binding: use PySide6 (LGPL). The project ships under MIT."

[tool.ruff.lint.per-file-ignores]
# Tests are proven by running, not by strict typing; literal draws and bet sizes
# are the point. Local imports are how monkeypatch targets get bound, asserts are
# how tests assert, and fixture factories legitimately take many knobs.
"tests/**" = ["ANN", "PLR2004", "ARG", "PLC0415", "PLR0913", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# packaging/ holds no Python any more (the placeholder icon generator went
# away with the real icons); mypy errors on a directory with nothing to check.
# ruff still covers the whole tree, so a .py returning there is not unlinted.
files = ["src", "tests", "scripts"]

# Test bodies are validated by execution; don't force full annotations there.
# disallow_untyped_calls goes with them: allowing an unannotated helper but not
# calls to it just moves the annotation one line up for no gain. src/ is
# untouched by this -- it stays fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
