# Dependabot watches the version *ranges* (pyproject.toml) and the action SHA
# pins (ci.yml). constraints.txt is regenerated by hand after a bump lands:
# pip install -e ".[dev]" && pip freeze --exclude-editable
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
