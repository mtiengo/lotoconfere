# CI quality gate - mirrors the local five-command gate:
# ruff check, ruff format --check, mypy strict, pytest with the coverage gate,
# pip-audit.
#
# CI never calls Caixa's endpoint. It is undocumented, rate-limited, and answers
# 403 to some cloud hosts, so a workflow that depended on it would fail for
# reasons that have nothing to do with the change. The live tests are marked
# `live` and excluded by pytest's default `-m 'not live'`; they are a local,
# manual run for detecting API drift.
#
# Supply-chain posture:
#   - every third-party action is pinned to a full commit SHA
#   - dependencies install against the committed constraints.txt lockfile
#   - pip-audit checks the resulting environment, and a weekly scheduled run
#     re-checks it so new advisories surface without a push
#   - the workflow token is read-only

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-audit of pinned dependencies (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned)
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Windows is the primary dev platform; macOS is a release target. Both
          # get one job each, on the newest supported Python.
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      # The PySide6 wheels bundle Qt itself but link against a few system
      # libraries a bare runner image may lack. Without them the GUI modules
      # fail to import, and the coverage gate then fails rather than skips.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64

      - name: Install (pinned)
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Test with coverage gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned)
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Audit installed environment
        run: pip-audit --skip-editable --progress-spinner off
