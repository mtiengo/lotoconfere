# SHA-256 digests of the build tools CI downloads, pinned deliberately.
#
# The extension is not .env, and must not be: a global gitignore containing
# *.env -- a common thing for a person to have -- silently keeps this file out
# of the repository, and the first sign of it is a release build failing on two
# runners at once.
#
# A build tool fetched from the internet is part of the supply chain, so it is
# verified like any dependency. The build scripts refuse to run with a blank pin
# rather than download something unverified.
#
# Each pin names a TAGGED release, never a "continuous" or "latest" asset: those
# are re-uploaded in place, so their digest changes under the pin and the build
# starts failing for a reason nobody can act on.
#
# To fill one: download the exact file the URL in the build script names, run
# `sha256sum` (or `Get-FileHash -Algorithm SHA256`) on it, and paste the digest
# here. Refresh a pin deliberately, never automatically -- dependency-change skill.

# packaging/build_appimage.sh -- appimagetool 1.9.1, x86_64.
# Verified 2026-09-26 against the bytes served by the 1.9.1 release URL.
APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

# .github/workflows/release.yml -- Inno Setup 6.7.3, extracted portable to build
# Setup.exe. Downloaded and pinned rather than taken from the runner image, so the
# installer is built by a known compiler instead of whatever the image ships this
# month. Verified 2026-09-26: digest matched the release asset, and the file
# carries a valid Authenticode signature (Pyrsys B.V. -- the co-maintainer's
# company; 6.7.3's release notes announce the new certificate).
INNOSETUP_URL=https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
INNOSETUP_SHA256=9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
